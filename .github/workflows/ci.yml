name: Go validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24.x", "stable"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gbme
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: gbme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gbme -d gbme"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -count=1 ./...
        env:
          GBME_MATRIX: "1"
          GBME_GIN_MATRIX: "1"
          TEST_DATABASE_URL: postgres://gbme:local-ci-only@localhost:5432/gbme?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: make build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file examples/toolbox/.env.example -f examples/toolbox/compose.yaml config --quiet
      - run: docker compose --env-file examples/toolbox/.env.example -f examples/toolbox/compose.yaml up --build -d --wait
      - run: curl --fail http://localhost:8080/ready
      - run: docker compose --env-file examples/toolbox/.env.example -f examples/toolbox/compose.yaml down
        if: always()
