# Automatic GitLab merge request reviews with MR-Agent.
# Generated by scripts/setup-gitlab.py; model and bot tokens live in CI/CD variables.
include:
  - project: "rnd/agentic-engineering/vivasoft-agents-studio-agent-code-review"
    ref: "e42a1e441336bc67601ccc989756ef4c75f463a7"
    file: '/templates/gitlab/mr-agent.gitlab-ci.yml'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - test

variables:
  MRAGENT_ENABLED: "true"
  MRAGENT_SOURCE_PROJECT: "rnd/agentic-engineering/vivasoft-agents-studio-agent-code-review"
  MRAGENT_REF: "e42a1e441336bc67601ccc989756ef4c75f463a7"
  MRAGENT_CONTEXT: "true"
  MRAGENT_DRY_RUN: "false"
